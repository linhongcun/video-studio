name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  # 发完 Release 后在 main 上手动触发一次（gh workflow run deploy.yml --ref main），让 /changelog/ 带上刚发布的版本
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          # 布局检查与站点构建不读取制作目录、文档归档中的音频、图片和视频原稿（约 12 GB），跳过后产物不变
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/episodes/**/production/**/*.wav
            !/episodes/**/production/**/*.png
            !/episodes/**/production/**/*.jpg
            !/episodes/**/production/**/*.mp4
            !/docs/**/*.png
            !/docs/**/*.jpg
      - name: Check episode directory layout
        run: python3 ../scripts/check-layout.py
      - name: Check repository size gate
        run: python3 ../scripts/check-repo-size.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIDEO_HOST_BASE_URL: ${{ vars.VIDEO_HOST_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
