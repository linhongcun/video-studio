<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">合并区间的排序与扫描示意图</title>
  <desc id="desc">同一组六个区间按输入顺序、按起点排序后和合并结果展示在同一数轴尺度上。</desc>
  <rect width="1200" height="650" fill="#0F172A"/>
  <g font-family="Noto Sans CJK SC, sans-serif" fill="#E5E7EB">
    <text x="48" y="52" font-size="25" font-weight="700">同一组输入：对象不变，处理顺序改变</text>
    <text x="48" y="84" font-size="16" fill="#9CAFC5">教学示例 · 数轴采用相同刻度；I0–I5 是原输入位置</text>
  </g>
  <g stroke="#30435E" stroke-width="1">
    <path d="M390 124H1080M390 312H1080M390 500H1080"/>
  </g>
  <g font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#9CAFC5" text-anchor="middle">
    <text x="390" y="116">0</text><text x="480" y="116">2</text><text x="570" y="116">4</text><text x="660" y="116">6</text><text x="750" y="116">8</text><text x="840" y="116">10</text><text x="930" y="116">12</text><text x="1020" y="116">14</text>
    <text x="390" y="304">0</text><text x="480" y="304">2</text><text x="570" y="304">4</text><text x="660" y="304">6</text><text x="750" y="304">8</text><text x="840" y="304">10</text><text x="930" y="304">12</text><text x="1020" y="304">14</text>
    <text x="390" y="492">0</text><text x="480" y="492">2</text><text x="570" y="492">4</text><text x="660" y="492">6</text><text x="750" y="492">8</text><text x="840" y="492">10</text><text x="930" y="492">12</text><text x="1020" y="492">14</text>
  </g>
  <g font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#FFCC70">
    <text x="48" y="116">原输入顺序</text>
    <text x="48" y="304">按起点处理</text>
    <text x="48" y="492">合并结果</text>
  </g>
  <g font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#E5E7EB">
    <text x="72" y="151" fill="#7DB5FF">I0 [8,10]</text><text x="72" y="176" fill="#56E4D3">I1 [1,4]</text><text x="72" y="201" fill="#BEADFF">I2 [2,3]</text><text x="72" y="226" fill="#F6A5C9">I3 [3,5]</text><text x="72" y="251" fill="#FFCC70">I4 [5,6]</text><text x="72" y="276" fill="#95D69B">I5 [12,14]</text>
    <text x="72" y="339" fill="#56E4D3">I1 [1,4]</text><text x="72" y="364" fill="#BEADFF">I2 [2,3]</text><text x="72" y="389" fill="#F6A5C9">I3 [3,5]</text><text x="72" y="414" fill="#FFCC70">I4 [5,6]</text><text x="72" y="439" fill="#7DB5FF">I0 [8,10]</text><text x="72" y="464" fill="#95D69B">I5 [12,14]</text>
    <text x="72" y="535">[1,6]</text><text x="72" y="570">[8,10]</text><text x="72" y="605">[12,14]</text>
  </g>
  <g stroke-width="8" stroke-linecap="round">
    <path d="M750 147H840" stroke="#7DB5FF"/><circle cx="750" cy="147" r="5" fill="#7DB5FF"/><circle cx="840" cy="147" r="5" fill="#7DB5FF"/>
    <path d="M435 172H570" stroke="#56E4D3"/><circle cx="435" cy="172" r="5" fill="#56E4D3"/><circle cx="570" cy="172" r="5" fill="#56E4D3"/>
    <path d="M480 197H525" stroke="#BEADFF"/><circle cx="480" cy="197" r="5" fill="#BEADFF"/><circle cx="525" cy="197" r="5" fill="#BEADFF"/>
    <path d="M525 222H615" stroke="#F6A5C9"/><circle cx="525" cy="222" r="5" fill="#F6A5C9"/><circle cx="615" cy="222" r="5" fill="#F6A5C9"/>
    <path d="M615 247H660" stroke="#FFCC70"/><circle cx="615" cy="247" r="5" fill="#FFCC70"/><circle cx="660" cy="247" r="5" fill="#FFCC70"/>
    <path d="M930 272H1020" stroke="#95D69B"/><circle cx="930" cy="272" r="5" fill="#95D69B"/><circle cx="1020" cy="272" r="5" fill="#95D69B"/>
  </g>
  <g stroke-width="8" stroke-linecap="round">
    <path d="M435 335H570" stroke="#56E4D3"/><circle cx="435" cy="335" r="5" fill="#56E4D3"/><circle cx="570" cy="335" r="5" fill="#56E4D3"/>
    <path d="M480 360H525" stroke="#BEADFF"/><circle cx="480" cy="360" r="5" fill="#BEADFF"/><circle cx="525" cy="360" r="5" fill="#BEADFF"/>
    <path d="M525 385H615" stroke="#F6A5C9"/><circle cx="525" cy="385" r="5" fill="#F6A5C9"/><circle cx="615" cy="385" r="5" fill="#F6A5C9"/>
    <path d="M615 410H660" stroke="#FFCC70"/><circle cx="615" cy="410" r="5" fill="#FFCC70"/><circle cx="660" cy="410" r="5" fill="#FFCC70"/>
    <path d="M750 435H840" stroke="#7DB5FF"/><circle cx="750" cy="435" r="5" fill="#7DB5FF"/><circle cx="840" cy="435" r="5" fill="#7DB5FF"/>
    <path d="M930 460H1020" stroke="#95D69B"/><circle cx="930" cy="460" r="5" fill="#95D69B"/><circle cx="1020" cy="460" r="5" fill="#95D69B"/>
  </g>
  <g stroke="#56E4D3" stroke-width="11" stroke-linecap="round" fill="#56E4D3">
    <path d="M435 530H660"/><circle cx="435" cy="530" r="6"/><circle cx="660" cy="530" r="6"/>
    <path d="M750 565H840"/><circle cx="750" cy="565" r="6"/><circle cx="840" cy="565" r="6"/>
    <path d="M930 600H1020"/><circle cx="930" cy="600" r="6"/><circle cx="1020" cy="600" r="6"/>
  </g>
</svg>
