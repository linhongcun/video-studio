<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t">
  <title id="t">字符串 ([)] 读到第 3 个字符时，右圆括号与最近一个未配对的左方括号类型不同</title>
  <rect width="1200" height="520" fill="#0F172A"/>
  <text x="60" y="64" fill="#E5E7EB" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600">示例 s = "([)]"：读到第 3 个字符右圆括号，该和谁配对？</text>
  <g font-family="JetBrains Mono, Menlo, monospace" font-weight="700" font-size="56" text-anchor="middle">
    <rect x="80" y="130" width="110" height="110" rx="16" fill="#16243A" stroke="#7DB5FF" stroke-width="4"/><text x="135" y="206" fill="#7DB5FF">(</text>
    <rect x="220" y="130" width="110" height="110" rx="16" fill="#16243A" stroke="#BEADFF" stroke-width="4"/><text x="275" y="206" fill="#BEADFF">[</text>
    <rect x="360" y="130" width="110" height="110" rx="16" fill="#16243A" stroke="#FFCC70" stroke-width="6"/><text x="415" y="206" fill="#7DB5FF">)</text>
    <rect x="500" y="130" width="110" height="110" rx="16" fill="#16243A" stroke="#BEADFF" stroke-width="4" opacity="0.45"/><text x="555" y="206" fill="#BEADFF" opacity="0.45">]</text>
  </g>
  <g fill="#9CAFC5" font-family="Noto Sans CJK SC, sans-serif" font-size="24" text-anchor="middle">
    <text x="135" y="282">第1个</text><text x="275" y="282">第2个</text><text x="415" y="282">第3个</text><text x="555" y="282">第4个</text>
  </g>
  <path d="M 415 112 l -16 -26 h 32 z" fill="#FFCC70"/>
  <text x="415" y="100" fill="#FFCC70" font-family="Noto Sans CJK SC, sans-serif" font-size="26" text-anchor="middle" font-weight="600" dy="-22">当前</text>
  <g font-family="Noto Sans CJK SC, sans-serif">
    <text x="800" y="120" fill="#FFCC70" font-size="30" font-weight="600" text-anchor="middle">还没配对的左括号</text>
    <path d="M 720 150 V 400 H 880 V 150" fill="none" stroke="#30435E" stroke-width="4"/>
    <rect x="740" y="316" width="120" height="72" rx="12" fill="#16243A" stroke="#7DB5FF" stroke-width="4"/>
    <text x="800" y="368" fill="#7DB5FF" font-family="JetBrains Mono, Menlo, monospace" font-size="46" font-weight="700" text-anchor="middle">(</text>
    <rect x="740" y="232" width="120" height="72" rx="12" fill="#3A1C22" stroke="#FF9B9B" stroke-width="4"/>
    <text x="800" y="284" fill="#FF9B9B" font-family="JetBrains Mono, Menlo, monospace" font-size="46" font-weight="700" text-anchor="middle">[</text>
    <text x="900" y="262" fill="#FFCC70" font-size="26" font-weight="600">最上面的 [</text><text x="900" y="298" fill="#FFCC70" font-size="26" font-weight="600">= 最近一个还没配对</text>
    <text x="800" y="432" fill="#9CAFC5" font-size="22" text-anchor="middle">更早</text>
  </g>
  <path d="M 470 185 C 560 185, 620 268, 736 268" fill="none" stroke="#FF9B9B" stroke-width="5" stroke-dasharray="12 10"/>
  <text x="600" y="330" fill="#FF9B9B" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" text-anchor="middle">) 与 [ 类型不同 → 无效</text>
  <text x="60" y="480" fill="#E5E7EB" font-family="Noto Sans CJK SC, sans-serif" font-size="26">[ 不先闭合，外层的 ( 就不能闭合，所以右括号只能和最近一个还没配对的左括号比较。</text>
</svg>
