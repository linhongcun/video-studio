<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-label="三数之和偏小排除左端示意图">
<rect width="1440" height="720" rx="24" fill="#0F172A"/><g font-family="Noto Sans CJK SC" fill="#E5E7EB">
<text x="76" y="100" font-size="38" font-weight="700">为什么和偏小时可以排除当前左端？</text>
<text x="76" y="158" fill="#9CAFC5" font-size="25">官方示例 1 排序后 · 下标从 0 开始</text>
<g><rect x="100" y="260" width="150" height="115" rx="16" fill="#16243A" stroke="#FFCC70" stroke-width="4"/><text x="175" y="337" text-anchor="middle" font-size="53">-4</text><text x="175" y="421" text-anchor="middle" fill="#9CAFC5" font-size="24">0</text></g><g><rect x="305" y="260" width="150" height="115" rx="16" fill="#16243A" stroke="#56E4D3" stroke-width="4"/><text x="380" y="337" text-anchor="middle" font-size="53">-1</text><text x="380" y="421" text-anchor="middle" fill="#9CAFC5" font-size="24">1</text></g><g><rect x="510" y="260" width="150" height="115" rx="16" fill="#16243A" stroke="#30435E" stroke-width="4"/><text x="585" y="337" text-anchor="middle" font-size="53">-1</text><text x="585" y="421" text-anchor="middle" fill="#9CAFC5" font-size="24">2</text></g><g><rect x="715" y="260" width="150" height="115" rx="16" fill="#16243A" stroke="#30435E" stroke-width="4"/><text x="790" y="337" text-anchor="middle" font-size="53">0</text><text x="790" y="421" text-anchor="middle" fill="#9CAFC5" font-size="24">3</text></g><g><rect x="920" y="260" width="150" height="115" rx="16" fill="#16243A" stroke="#30435E" stroke-width="4"/><text x="995" y="337" text-anchor="middle" font-size="53">1</text><text x="995" y="421" text-anchor="middle" fill="#9CAFC5" font-size="24">4</text></g><g><rect x="1125" y="260" width="150" height="115" rx="16" fill="#16243A" stroke="#A5B4FC" stroke-width="4"/><text x="1200" y="337" text-anchor="middle" font-size="53">2</text><text x="1200" y="421" text-anchor="middle" fill="#9CAFC5" font-size="24">5</text></g>
<text x="175" y="233" text-anchor="middle" fill="#FFCC70" font-size="29">固定 i</text><text x="380" y="233" text-anchor="middle" fill="#56E4D3" font-size="29">L</text><text x="1200" y="233" text-anchor="middle" fill="#A5B4FC" font-size="29">R</text>
<text x="720" y="520" text-anchor="middle" fill="#FFCC70" font-size="39">−4 + (−1) + 2 = −3 &lt; 0</text><text x="720" y="592" text-anchor="middle" font-size="29">2 已经是候选中最大的右值；换更小的数，总和只会更小。</text>
<path d="M380 646 H585 l-18 -12 m18 12 l-18 12" stroke="#56E4D3" stroke-width="5" fill="none"/><text x="640" y="657" fill="#56E4D3" font-size="29">排除当前 L，向右移动</text></g></svg>
