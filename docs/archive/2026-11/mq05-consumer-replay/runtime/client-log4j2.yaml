Configuration:
  status: error
  Appenders:
    Console:
      name: Console
      target: SYSTEM_ERR
      PatternLayout:
        pattern: '%d{ISO8601} %-5p %c{1} %m%n'
  Loggers:
    Logger:
      - name: org.apache.kafka.clients.NetworkClient
        level: debug
        additivity: false
        AppenderRef:
          ref: Console
    Root:
      level: warn
      AppenderRef:
        ref: Console
